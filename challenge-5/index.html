<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="../week-5-to-do-app-dengan-class-async-dom-smackerind/style.css">
</head>
<body>
    
    <main class="app">
        <h1 class="app__title">📝 To Do List</h1>
        <form id = "todo-form" class="form">
            <input
                type = "text"
                id ="todo-input"
                class="form__input" 
                placeholder="Tuliskan task barunya..." 
                autocomplete="off"
            />
            <button type="submit" 
            class="form__button">Adding</button>
        </form>
        <p id="message" class="message" role="status"></p>
        <ul id="todo-list" class="list"></ul>
        <p id="counter" class="counter"></p>
    </main>
   
    <script src="../week-5-to-do-app-dengan-class-async-dom-smackerind/script.js"></script>

</body>
</html>
