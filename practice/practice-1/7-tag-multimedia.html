<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 7 - Tag Multimedia</title>
  </head>
  <body>
    <h1>Materi 7 - Tag Multimedia</h1>
    <!-- 1. Video -->
    <h2>1. Video (video, source)</h2>
    <video controls>
      <source type="video/mp4" src="./assets/video.mp4" />
    </video>
    <!-- 2. Audio -->
    <h2>2. Audio (audio, source)</h2>
    <audio controls>
      <source type="audio/mp3" src="./assets/ding-sound-effect_2.mp3" />
    </audio>
    <!-- 3. iFrame -->
    <h2>3. iFrame</h2>
    <iframe
      width="1012"
      height="570"
      src="https://www.youtube.com/embed/-lGQgNw-yXk?list=PLI36ztA2la4_YvCXWo3Slox_gjiJqZndq"
      title="MATERI HTML #1 - OVERVIEW HTML"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <iframe
      data-testid="embed-iframe"
      style="border-radius: 12px"
      src="https://open.spotify.com/embed/track/4YxEeCKhUl1DawPzsxCPbq?utm_source=generator&si=c939ddd5b1d84a18"
      width="100%"
      height="352"
      frameborder="0"
      allowfullscreen=""
      allow="
        autoplay;
        clipboard-write;
        encrypted-media;
        fullscreen;
        picture-in-picture;
      "
      loading="lazy"
    ></iframe>
  </body>
</html>
