<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 8 - Tag Table</title>
  </head>
  <body>
    <h1>Materi 8 - Tag Table</h1>

    <!-- 1. Non Structure -->
    <h2>1. Non Structure</h2>
    <table border="1">
      <tr>
        <th>Nama</th>
        <th colspan="2">Kelas</th>
      </tr>
      <tr>
        <td>Sigit</td>
        <td rowspan="2">Netherlands</td>
        <td rowspan="2">Netherlands</td>
      </tr>
      <tr>
        <td>Ricky</td>
      </tr>
    </table>

    <!-- 2. Spesific Structure -->
    <h2>2. Spesific Structure</h2>
    <table border="1">
      <caption>
        table 1.1
      </caption>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Kelas</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sigit</td>
          <td>Netherlands</td>
        </tr>
        <tr>
          <td>Ricky</td>
          <td>Netherlands</td>
        </tr>
      </tbody>
    </table>
    <table border="1">
      <caption>
        table 1.2
      </caption>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Kelas</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sigit</td>
          <td>Netherlands</td>
        </tr>
        <tr>
          <td>Ricky</td>
          <td>Netherlands</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
