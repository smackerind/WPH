<!-- 1. Manual Code -->
<!-- <!doctype html> : Untuk mendefinisikan web kita menggunakan HTML5 -->
<!doctype html>
<!-- <html> : sebagai root elemen  -->
<html lang="en">
  <!-- <head> : informasi tentang website -->
  <head>
    <title>Materi 1 - Struktur HTML</title>
    <meta charset="UTF-8" />
  </head>

  <!-- <body> : semua hal yang ditampilkan di dalam website -->
  <body>
    <h1>Hello world</h1>
  </body>
</html>
