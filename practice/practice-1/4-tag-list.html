<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 4 - Tag List</title>
  </head>
  <body>
    <h1>Materi 4 - Tag List</h1>
    <!-- 1. Unordered List (<ul>, <li>) -->
    <h2>1. Unordered List (ul, li)</h2>
    <ul>
      <li>Nasi Padang</li>
      <li>Mie Goreng Aceh</li>
      <li>Sate Goreng</li>
    </ul>

    <!-- 2. Ordered List (<ol>, <li>) -->
    <h2>2. Ordered List (ol, li)</h2>
    <ol type="i">
      <li>Nasi Padang</li>
      <li>Mie Goreng Aceh</li>
      <li>Sate Goreng</li>
    </ol>
  </body>
</html>
