<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 1 - Flexbox</title>
    <link rel="stylesheet" href="../css/1-flexbox.css" />
  </head>
  <body>
    <h1>Materi 1 - Flexbox</h1>
    <!-- 1. Flex Container -->
    <div class="container">
      <div class="kotak merah"></div>
      <div class="kotak biru"></div>
      <div class="kotak hijau"></div>
    </div>

    <!-- 2. Flex Item -->
    <div class="container-item">
      <div class="kotak merah" style="order: 2">1</div>
      <div class="kotak biru" style="order: 1">2</div>
      <div class="kotak hijau" style="order: 3">3</div>
    </div>
  </body>
</html>
