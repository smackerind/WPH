<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thread Clone</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <img src="./assets/download.jpeg" alt="" class="profile" />
        <p class="plus">+</p>
        <h3>Albert Einstein</h3>
        <p class="date">08/06/2026</p>
      </div>
      <div class="desc">
        <p>
          Lorem ipsum dolor sit, amet consectetur adipisicing elit. Dolorum
          reprehenderit quia possimus quod veniam nam labore, maiores saepe
          harum eius.
        </p>

        <div class="icon-container">
          <div class="item-icon">
            <img src="./assets/heart.svg" alt="" class="icon heart" />
            <p class="text-heart">1.5k</p>
          </div>
          <div class="item-icon">
            <img
              src="./assets/comment-regular-full.svg"
              alt=""
              class="icon comment"
            />
            <p>1.5k</p>
          </div>
          <div class="item-icon">
            <img
              src="./assets/arrows-rotate-solid-full.svg"
              alt=""
              class="icon"
            />
            <p>1.5k</p>
          </div>
          <div class="item-icon">
            <img
              src="./assets/location-arrow-solid-full.svg"
              alt=""
              class="icon send"
            />
            <p>1.5k</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
